:root {
  --bprogress-color: #f5a623;
  --bprogress-height: 3px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px #f5a623, 0 0 5px #f5a623;
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  width: 0;
  height: 0;
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}

late\":\"%s - 幻彩拼豆\",\"description\":\"免費線上拼豆圖紙生成器，上傳任意圖片即可一鍵生成高清像素畫和拼豆底稿。支援自訂網格尺寸與配色方案，內建多品牌色號對照（Mard、Coco、漫漫、盼盼），配備專業級像素編輯器與沉浸式 3D 效果預覽。無需下載、無需註冊，直接在瀏覽器中使用，所有功能完全免費！\",\"appName\":\"幻彩拼豆\",\"ogLocale\":\"zh_TW\",\"logoAlt\":\"幻彩拼豆 Logo\",\"keywords\":\"拼豆圖紙生成器, 免費線上拼豆軟件, 像素畫轉拼豆底稿, Perler Beads pattern, 幻彩拼豆\",\"jsonLd\":{\"webapp\":{\"name\":\"幻彩拼豆\",\"description\":\"在線拼豆圖紙生成器，上傳圖片一鍵生成高清像素畫圖紙\",\"featureList\":[\"沉浸式 3D 預覽模式\",\"智能色彩匹配\",\"支持 Mard, Coco, 漫漫, 盼盼 等品牌\",\"自定義網格尺寸\",\"高清圖紙導出\",\"完全免費\"]},\"organization\":{\"name\":\"幻彩拼豆\"},\"website\":{\"name\":\"幻彩拼豆 - 拼豆圖紙生成器\"}}},\"navbar\":{\"title\":\"幻彩拼豆\",\"subtitle\":\"拼豆圖紙生成器\",\"login\":\"登入\",\"logout\":\"登出\",\"tutorials\":\"使用教學\",\"contact\":{\"button\":\"交流群\",\"shortButton\":\"交流群\",\"title\":\"交流群\",\"description\":\"加入 QQ 群取得使用回饋、問題協助和更新消息。\",\"qrAlt\":\"QQ 群 QR Code\"}},\"privacy\":{\"title\":\"隱私聲明與政策\",\"lastUpdated\":\"生效日期：{date}\",\"intro\":\"在您使用「幻彩拼豆-拼豆圖紙生成器」（以下簡稱「本服務」或「我們」）提供的各項功能、介面或相關支援服務時，您的隱私以及資訊安全是對我們至關重要的。本《隱私聲明與政策》詳細闡述了我們收集、使用數據的範疇、保留期限及安全標準，並說明了您對您的數據享有的權利。\",\"section1Title\":\"1. 我們收集和處理的資訊\",\"section1Content\":\"為保障本服務安全穩定地運行，我們可能在您互動期間處理以下幾類資訊。帳號憑據：當您註冊通行憑證時，您的基礎聯絡地址或加密密碼口令片段會被我們收集用於核驗身份及支援多設備狀態同步。系統使用日誌：我們可能會收集脫敏後的操作統計及網路日誌（例如診斷崩潰報告），用於增強應用程式可靠性和排除技術故障，此類數據將被匿名化聚合，不涉及對任何具體自然人身份的追蹤與錨定。\",\"section2Title\":\"2. 設備權限及本地處理原則\",\"section2Content\":\"為了實現產品核心的創作及渲染體驗，本服務在部分操作環節可能需調用您設備的特定功能接口（如本地瀏覽器快取或臨時系統存取）。請知悉，我們極其重視終端數據的隱私隔離：所有將您的私人圖像轉換為「拼豆圖紙模型」的圖像核心解析矩陣運算，完全僅在您的終端設備記憶體層面上即時隔離處理。除非您主動發出確切指令（例如將成品推送至公共畫廊伺服器），您的源素材與創作原型將嚴格隔離，絕不自動流轉或歸檔至我們的中心伺服器體系。\",\"section3Title\":\"3. 資訊保護標準與責任\",\"section3Content\":\"我們運用行業標準的安全傳輸協議與防火牆技術結構（如安全套接層 SSL/TLS 加密及密碼不可逆雜湊），多層防護並隔離您的帳戶檔案免遭非法存取及洩露。鑑於本服務的受眾廣泛性，若您未滿適用法律規定的法定成年年齡，您僅得在可證實已被法定監護人授權、且監護人已完全知曉且同意本政策明細的前提下存取或使用我們的服務網路。\",\"section4Title\":\"4. 您的控制權與數據清除\",\"section4Content\":\"您始終掌握著個人資訊的自主權。您隨時可以透過帳戶控制面板主動發起終止服務的請求，註銷流程全程無需人工核驗即可自助完成。當您的帳號註銷決議下達並被伺服器接納後，本服務網路將自動清除並阻斷有關您的全部檔案和留存配置文件；對您曾授權分發到公共環境（如作品畫廊）的內容池數據，我們將一併撤下或執行徹底去身份化脫敏（以切斷指向您帳號的任何連結），確保數據被妥善剝離。\",\"section5Title\":\"5. 面向外部環境的邊界與免責\",\"section5Content\":\"為了拓展功能，本服務可能容納並嵌套由獨立營運實體支援的連結元件及合作頁面。該等第三方外部站點不受本政策約束，且我們不對其執行各自獨立隱私框架的後果負責。當您離開本服務的受控生態而存取外部數位資產時，我們鄭重建議您自行評估相關風險並查閱該供應商獨立之資訊聲明。\",\"section6Title\":\"6. 政策更新及行使權利\",\"section6Content\":\"我們可能會在出現技術迭代或政策調整時適時修改此聲明。重大結構性變更發生時，我們將在此控制台頁面發布公示，變更一旦公布即具備相應契約效力。如您需行使查閱等相關數據權利，或對本政策的各項執行細節存有疑問欲提出隱私維權質詢，請聯絡我們的隱私合規團隊，指定信箱為：\"},\"projectHistory\":{\"title\":\"我的作品\",\"defaultName\":\"圖紙 {date}\",\"loading\":\"載入中...\",\"empty\":{\"title\":\"暫無已保存的作品\",\"description\":\"在編輯器中創作後，作品會自動保存在這裡\"},\"card\":{\"editing\":\"編輯中\",\"restore\":\"恢復\",\"fetch\":\"拉取\",\"fetching\":\"拉取中...\",\"delete\":\"刪除\",\"confirmDelete\":\"再次點擊確認刪除\",\"justNow\":\"剛剛\",\"minutesAgo\":\"{count} 分鐘前\",\"hoursAgo\":\"{count} 小時前\",\"daysAgo\":\"{count} 天前\",\"usedColors\":\"{count} 色\",\"totalBeads\":\"{count} 顆\",\"tooltipUsedColors\":\"已使用顏色數\",\"tooltipTotalBeads\":\"總珠子數\",\"preview3D\":\"3D 預覽\",\"renameTitle\":\"重新命名\",\"renameDescription\":\"更新目前項目名稱\",\"renamePlaceholder\":\"輸入項目名稱\",\"renameConfirm\":\"儲存\",\"moreActions\":\"更多操作\",\"publishPublic\":\"公開作品\",\"editPublication\":\"公開設定\",\"makePrivate\":\"轉為私有\",\"withdrawReview\":\"撤回審核\",\"moveToFolder\":\"移動\",\"duplicate\":\"複製\",\"export\":\"匯出\",\"discardUnsyncedChanges\":\"撤銷改動\",\"discardUnsyncedChangesTitle\":\"撤銷改動\",\"discardUnsyncedChangesDescription\":\"確認後會用最新雲端版本覆蓋目前本地專案內容。\",\"discardUnsyncedChangesConfirm\":\"確認撤銷\",\"discardingUnsyncedChanges\":\"正在撤銷...\",\"statusLocalOnly\":\"本地\",\"statusPendingSync\":\"待同步\",\"statusSynced\":\"已同步\",\"statusConflict\":\"版本衝突\",\"statusLocal\":\"本地\",\"statusCloudPrefix\":\"雲端\",\"statusCloudPrivate\":\"私有\",\"statusCloudPublic\":\"公開\",\"statusPendingShort\":\"待同步\",\"statusRemoteUpdateShort\":\"待更新\",\"statusConflictShort\":\"衝突\",\"visibilityPrivate\":\"私有\",\"visibilityPublic\":\"公開\",\"sync\":\"同步\",\"syncing\":\"同步中...\",\"localDeleteTitle\":\"刪除本地項目\",\"localDeleteDescription\":\"確認後會從目前裝置永久刪除這份本地項目。\",\"cl 值。對於任何試圖變現、場外交易積分的違規行為，我們有權予以攔截或進行帳號清退。\",\"section3Title\":\"3. 平台行為及社群規範\",\"section3Content\":\"我們在構建和諧數位社區的同時，要求您嚴格履約以下行為底線：不得利用本服務傳輸、分發或儲存任何違反普世價值觀、包含極端暴力、色情或危害未成年人成長的非法內容；不得侵犯第三方合法知識產權，包括但不限於上傳任何未經原創者（如動漫發行方或獨立設計師）授權的底圖素材，或對他人成果進行剽竊聲明。此外，嚴禁利用封包篡改、爬蟲或逆向工程手段對我們的伺服器端發起攻擊及異常數據拉取。對於任何越線行為，本服務營運方有權在無需事先通知的情況下立即執行警告、內容隱蔽或永久性封禁措施。\",\"section4Title\":\"4. 數位資產與知識產權所有權\",\"section4Content\":\"本服務運行所依賴的底層程式碼、演算法邏輯、介面呈現元素、品牌標識及官方標準素材的完整知識產權均歸屬於我們或我們的授權方。您使用本服務工具所獨立創作並生成的原創新圖紙，其著作權依法歸您個人所有。但當您選擇將這些創作數據公開發布至我們的開放畫廊或互動板塊時，即視為您授予了我們一項全球性、免版稅的、非獨家的特許使用權，允許我們在本服務生態範圍內對其進行展示、分發及必要的業務推廣展示。\",\"section5Title\":\"5. 其他生態資源與服務免責\",\"section5Content\":\"本服務中的許多公共圖紙數據均由去中心化的用戶創作者共享或採編自公有領域，其僅作為學習和興趣交流之目的。我們將盡合理商業努力維護系統穩定性，但針對包括但不限於基礎電力網路崩潰、骨幹網阻斷、系統級黑客攻擊等不可抗拒的外部因素導致的服務降級、中斷或數據遺失，我們無法向您擔保並承擔連帶的經濟賠償責任。若您認為平台內的部分公開資料侵害了您的正當權益，請隨時提起官方核准流程，我們將迅速介入處理。\",\"section6Title\":\"6. 協議更新與聯絡管道\",\"section6Content\":\"伴隨法律環境的變遷及我們服務結構的演進，我們可能會定期審閱並完善本協議條款。發生實質性修訂時，我們會透過在此頁面更新或在應用內適當位置公告的形式向您提示。如您在閱讀本協議內容時，對具體解釋邊界或您的法定權益保障存有疑慮，或遇到了必須交由官方處理的安全帳號爭議事項，均應以建立良好信任關係為基礎，優先透過內部聯絡管道尋求溝通化解。指定聯絡方式為郵件：\"},\"threeD\":{\"title\":\"3D 預覽\",\"description\":\"拼豆作品的 3D 預覽。使用滑鼠左鍵旋轉，右鍵平移，滾輪縮放。\",\"modes\":{\"default\":\"拼豆\",\"flat\":\"燙豆\",\"towel\":\"毛巾燙\"},\"config\":{\"shadows\":\"陰影\",\"rotation\":\"旋轉\",\"environment\":\"環境光\",\"pegboard\":\"拼豆板\",\"backgroundColor\":\"背景色\"},\"exportPng\":\"圖片\",\"exportPngAria\":\"下載 3D 預覽圖片\",\"exportFailed\":\"3D 圖片下載失敗，請稍後重試\",\"controls\":{\"rotate\":\"左鍵旋轉\",\"pan\":\"右鍵平移\",\"zoom\":\"滾輪縮放\"},\"loading\":\"正在加載...\"},\"toolbox\":{\"title\":\"工具箱\",\"tools\":{\"aiPixelArt\":{\"title\":\"AI圖片轉像素畫\",\"description\":\"透過AI編排將圖片轉換為像素畫\"},\"perfectPixel\":{\"title\":\"偽像素畫修正\",\"description\":\"將 AI 生成的「偽像素畫」修正成完美的像素畫\",\"panelTitle\":\"PERFECT PIXEL\",\"panelDescription\":\"上傳一張像素風圖片，自動偵測網格並輸出修正後的像素圖。\",\"defaultProjectName\":\"像素修正 {date}\",\"referenceLayerName\":\"參考圖（修正後）\",\"fields\":{\"image\":\"輸入圖片\",\"sampleMethod\":\"取樣方式\",\"manualGrid\":\"手動指定網格\",\"gridWidth\":\"網格寬
