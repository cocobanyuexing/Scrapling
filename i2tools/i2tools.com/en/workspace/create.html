:root {
  --bprogress-color: #f5a623;
  --bprogress-height: 3px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px #f5a623, 0 0 5px #f5a623;
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  width: 0;
  height: 0;
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}

cription\":\"Online perler bead pattern generator, upload photos to create HD pixel art patterns instantly\",\"featureList\":[\"Immersive 3D Preview Mode\",\"Smart Color Matching\",\"Supports Mard, Coco, Manman, Panpan brands\",\"Custom Grid Sizes\",\"HD Pattern Export\",\"Completely Free\"]},\"organization\":{\"name\":\"Magic Perler\"},\"website\":{\"name\":\"Magic Perler - Pattern Generator\"}}},\"navbar\":{\"title\":\"Magic Perler\",\"subtitle\":\"Bead Pattern Generator\",\"login\":\"Login\",\"logout\":\"Logout\",\"tutorials\":\"Usage Tutorials\",\"contact\":{\"button\":\"Community group\",\"shortButton\":\"Community\",\"title\":\"Community group\",\"description\":\"Join the QQ group for feedback, help, and product updates.\",\"qrAlt\":\"QQ group QR code\"}},\"privacy\":{\"title\":\"Privacy Policy\",\"lastUpdated\":\"Effective Date: {date}\",\"intro\":\"When you use the features, interfaces, or related support services provided by \\\"Magic Perler - Bead Pattern Generator\\\" (hereinafter referred to as \\\"the Service\\\" or \\\"we\\\"), your privacy and data security are of utmost importance to us. This Privacy Policy details the scope, retention periods, and security standards regarding our collection and use of data, and explains the rights you have over your data.\",\"section1Title\":\"1. Information We Collect and Process\",\"section1Content\":\"To ensure the safe and stable operation of the Service, we may process the following types of information during your interaction. Account Credentials: When you register an access credential, your basic contact address or encrypted password fragment will be collected for identity verification and multi-device state synchronization support. System Usage Logs: We may collect anonymized operational statistics and network logs (such as diagnostic crash reports) to enhance application reliability and troubleshoot technical faults. Such data is aggregated anonymously and does not involve tracking or anchoring of any specific natural person's identity.\",\"section2Title\":\"2. Device Permissions and Local Processing Principles\",\"section2Content\":\"To deliver the core creative and rendering experience of the product, certain operations of the Service may invoke specific functional interfaces of your device (e.g., local browser caching or temporary system access). Please be aware that we strictly value the privacy isolation of endpoint data: all core image resolution matrix operations that convert your private images into \\\"perler bead models\\\" are processed in real-time, completely and exclusively isolated within your device's memory level. Unless you issue an explicit and affirmative command (for example, pushing the finished product to the public gallery server), your source assets and creative prototypes will be strictly isolated and will never automatically circulate or be archived in our central server infrastructure.\",\"section3Title\":\"3. Information Security Standards and Responsibilities\",\"section3Content\":\"We utilize industry-standard secure transmission protocols and firewall technological architectures (such as Secure Sockets Layer SSL/TLS encryption and irreversible password hashing) to multi-layer defend and isolate your account profile from unauthorized access or disclosure. Given the broad audience of this Service, if you are under the legal age of majority as dictated by applicable law, you may only access or use our service network under the premise of verifiable authorization by a legal guardian, and only when such guardian is fully aware of and consents to the specifics of this policy.\",\"section4Title\":\"4. Your Controls and Data Erasure\",\"section4Content\":\"You retain full autonomy over your personal information at all times. You may initiate a request to terminate the service at any time through your account control panel; the cancellation process is entirely self-service and requires no manual verification. Once your account deletion resolution is issued and accepted by the server, the service network will automatically purge and block all your profiles and retained configuration files. Regarding any content pool data you previously authorized for distribution in public environments (such as the artwork gallery), we will concurrently remove or execute complete de-identification (severing any links pointing to your account) to ensure the data is properly detached.\",\"section5Title\":\"5. Boundaries and Disclaimers Regarding External Environments\",\"section5Content\":\"To expand functionality, the Service may incorporate and nest linked components and partnership pages supported by independent operating entities. These external third-party sites are not governed by this policy, and we hold no responsibility for the consequences of their enforcement of their own independent privacy frameworks. When you leave the controlled ecosystem of the Service to access external digital assets, we strongly advise you to independently evaluate the associated risks and review the specific privacy statements of those providers.\",\"section6Title\":\"6. Policy Updates and Exercising Rights\",\"section6Content\":\"We may appropriately modify this statement in response to technical iterations or policy adjustments. When significant structural changes occur, we will post a public notice on this console page. Once a change is published, it acquires immediate contractual effect. If you need to exercise related data rights such as access, or have questions regarding the execution details of this policy to lodge a privacy compliance inquiry, please contact our privacy compliance team. The designated email is:\"},\"projectHistory\":{\"title\":\"My Works\",\"defaultName\":\"Project {date}\",\"loading\":\"Loading...\",\"empty\":{\"title\":\"No saved projects\",\"description\":\"Your creations will be automatically saved here\"},\"card\":{\"editing\":\"Editing\",\"restore\":\"Restore\",\"fetch\":\"Fetch\",\"fetching\":\"Fetching...\
